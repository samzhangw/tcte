<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>114統測倒數計時</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <a href="https://www.techadmissions.net.tw/" class="logo" target="_blank">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 3L1 9L12 15L21 10.09V17H23V9L12 3Z" fill="white"/>
        <path d="M5 13.18V17.18L12 21L19 17.18V13.18L12 17L5 13.18Z" fill="white"/>
      </svg>
      <span class="logo-text">114統測倒數</span>
    </a>
    <button class="menu-btn">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <nav class="nav-links">
      <a href="https://www.tcte.edu.tw/" target="_blank">最新消息</a>
      <a href="https://tyctw.github.io/114clock/" target="_blank">會考倒數</a>
      <a href="https://ceecc.vercel.app/" target="_blank">學測倒數</a>
    </nav>
  </header>
  <div class="floating-shapes">
    <!-- Decorative SVG shapes will be added here via JavaScript -->
  </div>
  <div class="container">
    <h1>114年統一入學測驗倒數</h1>
    <div class="countdown">
      <div class="time-block">
        <span id="days">--</span>
        <span class="label">天</span>
      </div>
      <div class="time-block">
        <span id="hours">--</span>
        <span class="label">時</span>
      </div>
      <div class="time-block">
        <span id="minutes">--</span>
        <span class="label">分</span>
      </div>
      <div class="time-block">
        <span id="seconds">--</span>
        <span class="label">秒</span>
      </div>
    </div>
    <div class="date-info">
      <p>考試日期：114年4月26日至27日（星期六、日）</p>
    </div>
    <div class="notification-section">
      <button id="notification-btn" class="notification-btn">
        <svg class="notification-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z" fill="currentColor"/>
        </svg>
        開啟每日通知
      </button>
      <p class="notification-status"></p>
    </div>
    <div class="reminder">
      <p>請把握時間準備，祝考試順利！✨</p>
    </div>
  </div>
  <footer class="copyright">
    <p>&copy; <span id="copyright-year"></span> 統測倒數計時器. All rights reserved.</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
