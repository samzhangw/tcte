<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2025統測倒數計時</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="floating-shapes">
    <!-- Decorative SVG shapes will be added here via JavaScript -->
  </div>
  <div class="container">
    <h1>2025年統一入學測驗倒數</h1>
    <div class="countdown">
      <div class="time-block">
        <span id="days">--</span>
        <span class="label">天</span>
      </div>
      <div class="time-block">
        <span id="hours">--</span>
        <span class="label">時</span>
      </div>
      <div class="time-block">
        <span id="minutes">--</span>
        <span class="label">分</span>
      </div>
      <div class="time-block">
        <span id="seconds">--</span>
        <span class="label">秒</span>
      </div>
    </div>
    <div class="date-info">
      <p>考試日期：114年4月26日至27日（星期六、日）</p>
    </div>
    <div class="reminder">
      <p>請把握時間準備，祝考試順利！✨</p>
    </div>
  </div>
  <footer class="copyright">
    <p>&copy; <span id="copyright-year"></span> 統測倒數計時器. All rights reserved.</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
